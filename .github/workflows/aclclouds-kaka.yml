name: AclClouds-卡卡自动续期

on:
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  secrets: write        # gh CLI 把浏览器登录拿到的新 Cookie 写回 ACL_COOKIES Secret

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖 (xvfb 供浏览器 GUI 操作 + 中文字体)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install -r requirements.txt
          seleniumbase install chromedriver || true

      - name: 设置代理 (sing-box, 供浏览器过 Turnstile)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 执行续期
        env:
          ACL_COOKIES: ${{ secrets.ACL_COOKIES }}
          ACL_ACCOUNTS: ${{ secrets.ACL_ACCOUNTS }}
          ACL_EMAIL: ${{ secrets.ACL_EMAIL }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          IS_PROXY: "true"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # xvfb-run 提供虚拟显示器, uc_gui_click_captcha 的 GUI 点击才能工作
        run: xvfb-run --auto-servernum python renew_fixed.py
